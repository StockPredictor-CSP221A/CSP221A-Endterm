name: Publish Dev Images

# Builds and publishes development images to GitHub Container Registry.
#
# - Push to dev (including merges): publish the slim backend :dev and the
#   frontend :dev images.
# - Manual run: publish the backend :dev-ml image (with torch/timesfm). Tick
#   "publish_dev" to also refresh the standard :dev images.
#
# Packages must have their visibility set to public in the package settings on
# GitHub before anonymous pulls work; see the README.

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      publish_dev:
        description: Also rebuild the standard :dev images
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-dev:
    name: Publish ${{ matrix.name }} :dev
    if: github.event_name == 'push' || github.event.inputs.publish_dev == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dev-images-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile.dev
            image: backend
            cache_scope: backend-dev
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile.dev
            image: frontend
            cache_scope: frontend-dev
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Resolve lowercase image namespace
        id: vars
        # GHCR image names must be lowercase; github.repository preserves case.
        run: echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/${{ matrix.image }}
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=dev-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  publish-dev-ml:
    name: Publish backend :dev-ml
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: dev-images-ml-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Resolve lowercase image namespace
        id: vars
        # GHCR image names must be lowercase; github.repository preserves case.
        run: echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/backend
          tags: |
            type=raw,value=dev-ml
            type=sha,format=short,prefix=dev-ml-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.dev
          build-args: |
            INCLUDE_ML=true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-dev-ml
          cache-to: type=gha,mode=max,scope=backend-dev-ml
