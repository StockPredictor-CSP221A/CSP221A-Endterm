name: PR Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: dev

jobs:
  frontend:
    name: (Frontend) Install, Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install Node.js dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint
    
  backend:
    name: (Backend) Install, Sync, Lint, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
    - name: Check out Git repository
      uses: actions/checkout@v7

    - name: Set Up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.11.31"
        enable-cache: true
        prune-cache: true

    - name: Sync uv dependencies
      run: uv sync --frozen

    - name: Run linter
      run: uv run ruff check .

    - name: Run test
      run: uv run pytest -q
